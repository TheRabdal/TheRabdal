<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">TheRabdal — developer profile</title>
  <desc id="desc">A custom dark terminal-inspired profile banner with a glowing monogram and developer details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78f0d0"/>
      <stop offset="1" stop-color="#91a7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#334155" stroke-opacity=".8"/>

  <path d="M24 58H1176" stroke="#334155" stroke-opacity=".8"/>
  <circle cx="34" cy="30" r="6" fill="#ff6b6b"/>
  <circle cx="56" cy="30" r="6" fill="#ffd166"/>
  <circle cx="78" cy="30" r="6" fill="#70e1b5"/>
  <text x="600" y="35" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="2">THE RABDAL · PERSONAL CONSOLE</text>

  <circle cx="208" cy="220" r="94" fill="#73e8ce" opacity=".12" filter="url(#soft-glow)"/>
  <circle cx="208" cy="220" r="76" fill="#111827" stroke="url(#glow)" stroke-width="2"/>
  <path d="M179 260V180h18l39 51v-51h18v80h-17l-40-52v52z" fill="url(#glow)"/>
  <circle cx="264" cy="274" r="5" fill="#78f0d0"/>

  <path d="M350 94V344" stroke="#334155" stroke-width="1"/>
  <text x="397" y="124" fill="#78f0d0" font-family="monospace" font-size="14" letter-spacing="2">$ WHOAMI</text>
  <text x="397" y="171" fill="#f8fafc" font-family="sans-serif" font-size="35" font-weight="700">Muhammad Kautsar Rizqi Abdal</text>
  <text x="397" y="211" fill="#cbd5e1" font-family="monospace" font-size="17">FULL-STACK DEVELOPER <tspan fill="#475569">/</tspan> DISTRO HOPPER</text>

  <rect x="397" y="244" width="8" height="8" rx="2" fill="#78f0d0"/>
  <text x="418" y="254" fill="#94a3b8" font-family="monospace" font-size="15">"Ngoding aja dulu, jagonya mah belakangan!"</text>

  <text x="397" y="310" fill="#64748b" font-family="monospace" font-size="13">CODE / CREATE</text>
  <text x="510" y="310" fill="#334155" font-family="monospace" font-size="13">·</text>
  <text x="530" y="310" fill="#64748b" font-family="monospace" font-size="13">OPEN TERMINAL</text>
  <text x="1158" y="358" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">01 / PROFILE</text>
</svg>
