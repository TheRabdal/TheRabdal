<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TheRabdal — building worlds, one line at a time</title>
  <desc id="desc">A colorful illustrated developer outpost floating above a glowing digital planet, with the profile of Muhammad Kautsar Rizqi Abdal.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152d"/>
      <stop offset=".52" stop-color="#171637"/>
      <stop offset="1" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="planet" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffbd78"/>
      <stop offset=".45" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#945bdb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263459"/>
      <stop offset="1" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74f0d0"/>
      <stop offset="1" stop-color="#8ea2ff"/>
    </linearGradient>
    <pattern id="stars" width="120" height="100" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#e2e8ff" opacity=".65"/>
      <circle cx="78" cy="64" r=".9" fill="#e2e8ff" opacity=".55"/>
      <circle cx="105" cy="24" r=".7" fill="#74f0d0" opacity=".7"/>
      <circle cx="42" cy="88" r=".8" fill="#ffbd78" opacity=".6"/>
    </pattern>
    <clipPath id="planet-clip">
      <circle cx="941" cy="274" r="118"/>
    </clipPath>
    <filter id="planet-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="small-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="24" fill="url(#space)"/>
  <rect width="1200" height="430" rx="24" fill="url(#stars)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#8291c7" stroke-opacity=".3"/>

  <path d="M0 365C190 320 290 418 475 390s289-85 451-48 203 60 274 27v61H0z" fill="#15203b" opacity=".62"/>
  <path d="M0 384c203-49 317 34 489 4s286-73 444-43 202 39 267 15" fill="none" stroke="#6273a4" stroke-opacity=".18"/>

  <g fill="#cbd5ff" font-family="monospace">
    <text x="58" y="58" font-size="13" letter-spacing="3" fill="#8ea2ff">THE RABDAL</text>
    <text x="1140" y="58" font-size="12" letter-spacing="2" text-anchor="end" fill="#68799f">DEV LOG / 001</text>
  </g>

  <g transform="translate(58 119)">
    <rect width="7" height="7" rx="3.5" y="-11" fill="#74f0d0"/>
    <text x="19" y="0" fill="#8fa4bd" font-family="monospace" font-size="13" letter-spacing="2">TRANSMISSION RECEIVED</text>
    <text x="0" y="57" fill="#f4f2ff" font-family="sans-serif" font-size="42" font-weight="700">Muhammad Kautsar</text>
    <text x="0" y="105" fill="#f4f2ff" font-family="sans-serif" font-size="42" font-weight="700">Rizqi Abdal</text>
    <path d="M0 129h48" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="164" fill="#c2c9e2" font-family="monospace" font-size="15" letter-spacing="1">FULL-STACK DEVELOPER</text>
    <text x="0" y="191" fill="#c2c9e2" font-family="monospace" font-size="15" letter-spacing="1">DISTRO HOPPER <tspan fill="#6e789b">/</tspan> WORLD BUILDER</text>
    <text x="0" y="237" fill="#74f0d0" font-family="monospace" font-size="15">“Ngoding aja dulu, jagonya mah belakangan!”</text>
  </g>

  <g>
    <circle cx="941" cy="274" r="145" fill="#ff719c" opacity=".18" filter="url(#planet-glow)"/>
    <ellipse cx="941" cy="286" rx="211" ry="64" transform="rotate(-17 941 286)" fill="none" stroke="#8ea2ff" stroke-opacity=".72" stroke-width="2"/>
    <ellipse cx="941" cy="286" rx="211" ry="64" transform="rotate(-17 941 286)" fill="none" stroke="#8ea2ff" stroke-opacity=".25" stroke-width="9" filter="url(#small-glow)"/>
    <circle cx="941" cy="274" r="118" fill="url(#planet)"/>
    <g clip-path="url(#planet-clip)" opacity=".72">
      <path d="M806 195c60 28 76 8 128 25s76 3 140-22v31c-57 27-84 47-145 30s-91 4-139-24z" fill="#ffd49c" opacity=".55"/>
      <path d="M814 253c59-18 83 4 126-8s88-4 145 16v23c-65-17-95-20-145-4s-78-2-126 12z" fill="#723eae" opacity=".52"/>
      <path d="M813 316c54-16 94 9 142-4s82-9 144 13v42H812z" fill="#493c9c" opacity=".58"/>
      <path d="M843 163c22 48 24 102 0 154M898 155c20 52 20 128-1 183M954 156c-16 66-14 128 3 180M1011 176c-23 55-18 106 6 154" fill="none" stroke="#ffe1bd" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="887" cy="226" r="3" fill="#fff0cd"/>
      <circle cx="996" cy="303" r="4" fill="#ffddab"/>
      <circle cx="923" cy="336" r="2" fill="#fff0cd"/>
    </g>
    <ellipse cx="941" cy="286" rx="211" ry="64" transform="rotate(-17 941 286)" fill="none" stroke="#ffbd78" stroke-width="4" stroke-dasharray="126 420" stroke-dashoffset="-34" stroke-linecap="round"/>
    <circle cx="772" cy="338" r="5" fill="#74f0d0"/>
    <circle cx="1106" cy="231" r="4" fill="#ffbd78"/>

    <g transform="translate(1020 102) rotate(11)">
      <rect x="0" y="0" width="92" height="61" rx="8" fill="#0d1429" stroke="#8194c8" stroke-width="1.5"/>
      <path d="M0 17h92" stroke="#394668"/>
      <circle cx="12" cy="9" r="2.2" fill="#ff7e9e"/>
      <circle cx="21" cy="9" r="2.2" fill="#ffd166"/>
      <circle cx="30" cy="9" r="2.2" fill="#74f0d0"/>
      <path d="m16 34 8 6-8 6m15 0h19" fill="none" stroke="#74f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="43" fill="#8290b7" font-family="monospace" font-size="9">~/dev</text>
    </g>

    <g transform="translate(1081 345)">
      <path d="M0 0h48l-8 15H8z" fill="#35446b"/>
      <path d="M10 15h28l-4 11H14z" fill="#222e50"/>
      <path d="M15 0V-8m18 8V-8" stroke="#8999c3" stroke-width="2"/>
      <circle cx="24" cy="-12" r="4" fill="#74f0d0"/>
    </g>
  </g>

  <g fill="#7080a6" font-family="monospace" font-size="11" letter-spacing="2">
    <text x="58" y="386">BUILDING IN PUBLIC</text>
    <text x="1140" y="386" text-anchor="end">STAY CURIOUS · KEEP SHIPPING</text>
  </g>
</svg>
