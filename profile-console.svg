<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">TheRabdal — Cyberdeck OS v4.0.2</title>
  <desc id="desc">An advanced cyberpunk terminal and holographic command center for Muhammad Kautsar Rizqi Abdal.</desc>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.5" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0844"/>
      <stop offset="1" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b19fff"/>
      <stop offset="1" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1.2" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="20" fill="url(#grid)"/>
  
  <!-- Cyberpunk Glowing Orbs / Nebula -->
  <circle cx="1050" cy="100" r="180" fill="#7928ca" opacity="0.25" filter="url(#glow-pink)"/>
  <circle cx="150" cy="380" r="150" fill="#00f2fe" opacity="0.15" filter="url(#glow-cyan)"/>
  <circle cx="600" cy="240" r="220" fill="#4338ca" opacity="0.12" filter="url(#glow-cyan)"/>

  <!-- Holographic Grid Floor / Perspective Lines -->
  <g opacity="0.25">
    <line x1="0" y1="480" x2="450" y2="300" stroke="#00f2fe" stroke-width="1"/>
    <line x1="1200" y1="480" x2="750" y2="300" stroke="#00f2fe" stroke-width="1"/>
    <line x1="200" y1="480" x2="520" y2="300" stroke="#7928ca" stroke-width="1"/>
    <line x1="1000" y1="480" x2="680" y2="300" stroke="#7928ca" stroke-width="1"/>
    <path d="M 0 380 Q 600 340 1200 380" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6"/>
  </g>

  <!-- HUD Frame & Border -->
  <rect x="12" y="12" width="1176" height="456" rx="14" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.8"/>
  <!-- Corner Tech Brackets -->
  <path d="M 12 52 L 12 26 A 14 14 0 0 1 26 12 L 52 12" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 1188 52 L 1188 26 A 14 14 0 0 0 1174 12 L 1148 12" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 12 428 L 12 454 A 14 14 0 0 0 26 468 L 52 468" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 1188 428 L 1188 454 A 14 14 0 0 1 1174 468 L 1148 468" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>

  <!-- Top Bar / Header Status -->
  <g transform="translate(35, 38)">
    <!-- Window Controls -->
    <circle cx="0" cy="0" r="6" fill="#ff5f56"/>
    <circle cx="20" cy="0" r="6" fill="#ffbd2e"/>
    <circle cx="40" cy="0" r="6" fill="#27c93f"/>

    <text x="70" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#94a3b8" letter-spacing="2">SYS_ID: THERABDAL_CORE // SECURE_SOCKET</text>
    
    <!-- Live Ping / Status Badge -->
    <rect x="980" y="-10" width="135" height="22" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="994" cy="1" r="4" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1008" y="5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00f2fe" letter-spacing="1">ONLINE [99.9%]</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="65" x2="1165" y2="65" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Left Column: Main Identity & Bio -->
  <g transform="translate(60, 105)">
    <!-- Terminal Tag -->
    <g>
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e1b4b" stroke="#7928ca" stroke-width="1"/>
      <text x="12" y="16" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#c084fc" letter-spacing="1.5">&gt; ROOT_USER</text>
    </g>

    <!-- Name & Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      Muhammad Kautsar
    </text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#neon-cyan)" letter-spacing="-0.5" filter="url(#glow-cyan)">
      Rizqi Abdal
    </text>

    <!-- Glowing Accent Bar -->
    <rect x="0" y="145" width="220" height="3" rx="1.5" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>

    <!-- Roles / Skills badges -->
    <g transform="translate(0, 175)">
      <!-- Role 1 -->
      <rect x="0" y="0" width="185" height="30" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <text x="14" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#38bdf8">⚡ FULL-STACK DEV</text>

      <!-- Role 2 -->
      <rect x="195" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#7928ca" stroke-width="1"/>
      <text x="210" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c084fc">🔮 DISTRO HOPPER</text>

      <!-- Role 3 -->
      <rect x="370" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="385" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f472b6">🌌 WORLD BUILDER</text>
    </g>

    <!-- Quote / Manifesto -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="540" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <path d="M 0 8 L 0 44" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
      <text x="20" y="22" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#94a3b8">QUOTIENT_MANIFESTO:</text>
      <text x="20" y="40" font-family="'Courier New', monospace" font-size="13" font-style="italic" fill="#e2e8f0">“Ngoding aja dulu, jagonya mah belakangan!”</text>
    </g>
  </g>

  <!-- Right Column: Holographic Cyberdeck Widget / Interactive Code Terminal -->
  <g transform="translate(640, 95)">
    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="500" height="345" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.5))"/>
    
    <!-- Terminal Header -->
    <path d="M 0 35 L 500 35" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="38" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="54" cy="17" r="4.5" fill="#10b981"/>
    <text x="250" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#94a3b8">therabdal@nexus-deck: ~</text>

    <!-- Terminal Content / Live Code Execution -->
    <g transform="translate(25, 60)" font-family="'Courier New', monospace" font-size="13">
      <!-- Prompt line 1 -->
      <text x="0" y="0" fill="#00f2fe">$</text>
      <text x="20" y="0" fill="#f8fafc">whoami --verbose</text>
      
      <!-- Output 1 -->
      <text x="0" y="25" fill="#64748b">[INFO] Loading profile metadata...</text>
      <text x="0" y="45" fill="#c084fc">Name    :</text><text x="90" y="45" fill="#38bdf8">Muhammad Kautsar Rizqi Abdal</text>
      <text x="0" y="65" fill="#c084fc">Status  :</text><text x="90" y="65" fill="#10b981">Building clean, high-performance systems</text>
      <text x="0" y="85" fill="#c084fc">Stack   :</text><text x="90" y="85" fill="#f472b6">[Dart, C++, TS, Python, Flutter, Linux]</text>

      <!-- Prompt line 2 -->
      <text x="0" y="125" fill="#00f2fe">$</text>
      <text x="20" y="125" fill="#f8fafc">git status --ignored</text>

      <!-- Output 2 -->
      <text x="0" y="150" fill="#64748b">On branch master</text>
      <text x="0" y="170" fill="#38bdf8">Changes ready for deployment:</text>
      <text x="20" y="190" fill="#10b981">✓ AI-Readiness architecture optimized</text>
      <text x="20" y="210" fill="#10b981">✓ Automated workflows active</text>
      
      <!-- Blinking cursor prompt -->
      <text x="0" y="250" fill="#00f2fe">$</text>
      <rect x="20" y="238" width="10" height="15" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Holographic Radar / Tech Accent in corner of card -->
    <g transform="translate(430, 280)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.6"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#00f2fe" stroke-width="0.5" opacity="0.4"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#00f2fe" stroke-width="0.5" opacity="0.4"/>
      <!-- Radar Sweep -->
      <path d="M 0 0 L 21 -21 A 30 30 0 0 1 30 0 Z" fill="#00f2fe" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Bottom Scanline overlay for retro CRT/Cyberpunk feel -->
  <rect width="1200" height="480" rx="20" fill="url(#scanlines)" pointer-events="none" opacity="0.6"/>

  <!-- Footer Tech Ticker -->
  <g transform="translate(60, 452)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="10" fill="#64748b" letter-spacing="1">SECURE_HASH: 0x7F8C2A9B // HOST: GITHUB_CONTAINER // READY_FOR_NEXT_CHALLENGE</text>
  </g>
</svg>
